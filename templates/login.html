<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Lens</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .logo { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .tagline { font-size: 13px; color: #64748B; margin-bottom: 28px; }
    .tabs {
      display: flex;
      border-bottom: 1px solid #E2E8F0;
      margin-bottom: 24px;
      gap: 0;
    }
    .tab {
      flex: 1;
      padding: 9px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.active { color: #10B981; border-bottom-color: #10B981; }
    .panel { display: none; }
    .panel.active { display: block; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
    }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #0F172A;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #10B981; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
    .btn-primary {
      width: 100%;
      padding: 11px;
      background: #10B981;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #059669; }
    .btn-primary:disabled { background: #6EE7B7; cursor: not-allowed; }
    .error-msg {
      background: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Session Lens</div>
    <div class="tagline">Record and replay user sessions</div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Sign In</div>
      <div class="tab" onclick="switchTab('register')">Create Account</div>
    </div>

    <div id="panel-login" class="panel active">
      <div class="error-msg" id="login-error"></div>
      <form id="login-form">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
    </div>

    <div id="panel-register" class="panel">
      <div class="error-msg" id="register-error"></div>
      <form id="register-form">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required>
        <label>Password</label>
        <input type="password" name="password" autocomplete="new-password" required>
        <label>Confirm Password</label>
        <input type="password" name="confirm" autocomplete="new-password" required>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    function switchTab(name) {
      ['login','register'].forEach(function(t) {
        document.querySelector('.tab:nth-child(' + (t==='login'?1:2) + ')').classList.toggle('active', t===name);
        document.getElementById('panel-' + t).classList.toggle('active', t===name);
      });
    }

    function wireForm(formId, url, errorId) {
      var form = document.getElementById(formId);
      var btn = form.querySelector('button');
      var errEl = document.getElementById(errorId);
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        errEl.style.display = 'none';
        btn.disabled = true;
        fetch(url, { method: 'POST', body: new FormData(form) })
          .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
          .then(function(res) {
            if (res.data.ok) { window.location.href = '/dashboard'; }
            else { errEl.textContent = res.data.error || 'Something went wrong.'; errEl.style.display = 'block'; btn.disabled = false; }
          })
          .catch(function() { errEl.textContent = 'Network error. Please try again.'; errEl.style.display = 'block'; btn.disabled = false; });
      });
    }

    wireForm('login-form', '/login', 'login-error');
    wireForm('register-form', '/register', 'register-error');
  </script>
</body>
</html>
