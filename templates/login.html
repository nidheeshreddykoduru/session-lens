<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Session Lens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f7f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 36px 40px; width: 360px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid #e5e5e5; margin-bottom: 24px; }
    .tab { flex: 1; padding: 8px 0; text-align: center; font-size: 13px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    .panel { display: none; }
    .panel.active { display: block; }
    label { display: block; font-size: 12px; font-weight: 500; color: #555; margin-bottom: 5px; }
    input[type=text], input[type=password] { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; margin-bottom: 14px; }
    input:focus { border-color: #2563eb; }
    button[type=submit] { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; }
    button[type=submit]:hover { background: #1d4ed8; }
    button[type=submit]:disabled { background: #93c5fd; cursor: not-allowed; }
    .error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; border-radius: 6px; padding: 9px 12px; font-size: 13px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Session Lens</h1>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Sign In</div>
      <div class="tab" onclick="switchTab('register')">Create Account</div>
    </div>

    <!-- Login -->
    <div id="panel-login" class="panel active">
      <div class="error" id="login-error"></div>
      <form id="login-form">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign In</button>
      </form>
    </div>

    <!-- Register -->
    <div id="panel-register" class="panel">
      <div class="error" id="register-error"></div>
      <form id="register-form">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required>
        <label>Password</label>
        <input type="password" name="password" autocomplete="new-password" required>
        <label>Confirm Password</label>
        <input type="password" name="confirm" autocomplete="new-password" required>
        <button type="submit">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(function(t, i) {
        t.classList.toggle('active', (i === 0 && name === 'login') || (i === 1 && name === 'register'));
      });
      document.getElementById('panel-login').classList.toggle('active', name === 'login');
      document.getElementById('panel-register').classList.toggle('active', name === 'register');
    }

    function showError(id, msg) {
      var el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError(id) {
      document.getElementById(id).style.display = 'none';
    }

    function submitForm(formId, url, errorId) {
      var form = document.getElementById(formId);
      var btn = form.querySelector('button[type=submit]');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        hideError(errorId);
        btn.disabled = true;
        fetch(url, { method: 'POST', body: new FormData(form) })
          .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
          .then(function(res) {
            if (res.data.ok) {
              window.location.href = '/dashboard';
            } else {
              showError(errorId, res.data.error || 'Something went wrong.');
              btn.disabled = false;
            }
          })
          .catch(function() {
            showError(errorId, 'Network error. Please try again.');
            btn.disabled = false;
          });
      });
    }

    submitForm('login-form', '/login', 'login-error');
    submitForm('register-form', '/register', 'register-error');
  </script>
</body>
</html>
