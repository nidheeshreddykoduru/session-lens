<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Replay — {{ session_id }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/style.css">
  <script src="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/index.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 14px 30px; display: flex; align-items: center; gap: 12px; }
    header a { color: #888; font-size: 13px; text-decoration: none; }
    header a:hover { color: #fff; }
    header .sep { color: #333; }
    header .sid { font-family: monospace; font-size: 13px; color: #aaa; }
    #loading { flex: 1; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; }
    #player-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <a href="/dashboard">← Dashboard</a>
    <span class="sep">|</span>
    <a href="/project/{{ project_id }}">← Project</a>
    <span class="sep">|</span>
    <span class="sid">{{ session_id }}</span>
  </header>

  <div id="loading">Loading session...</div>
  <div id="player-wrap" style="display:none;"></div>

  <script>
    fetch('/sessions/{{ project_id }}/{{ session_id }}')
      .then(r => r.json())
      .then(events => {
        document.getElementById('loading').style.display = 'none';
        const wrap = document.getElementById('player-wrap');
        wrap.style.display = 'flex';
        new rrwebPlayer({
          target: wrap,
          props: { events, width: 1024, height: 576, autoPlay: true },
        });
      })
      .catch(err => {
        document.getElementById('loading').innerHTML =
          '<span class="error">Failed to load session: ' + err.message + '</span>';
      });
  </script>
</body>
</html>
