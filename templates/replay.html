<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replay — {{ session_id }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/style.css">
  <script src="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/index.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0F172A;
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1E293B;
      border-bottom: 1px solid #334155;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748B;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.15s;
    }
    .back-link:hover { color: #E2E8F0; }
    .divider { color: #334155; }
    .session-info { font-size: 13px; color: #64748B; }
    .session-id { font-family: 'Menlo', 'Monaco', monospace; font-size: 12px; color: #10B981; }

    #player-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #475569;
      font-size: 14px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #1E293B;
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state { color: #F87171; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <header class="header">
    <a href="/project/{{ project.id }}" class="back-link">← {{ project.name }}</a>
    <span class="divider">|</span>
    <span class="session-info">Session <span class="session-id">{{ session_id }}</span></span>
  </header>

  <div id="player-wrap">
    <div id="loading">
      <div class="spinner"></div>
      Loading session...
    </div>
  </div>

  <script>
    fetch('/sessions/{{ project.id }}/{{ session_id }}')
      .then(function(r) { return r.json(); })
      .then(function(events) {
        var wrap = document.getElementById('player-wrap');
        wrap.innerHTML = '';
        new rrwebPlayer({
          target: wrap,
          props: {
            events: events,
            width: Math.min(1024, window.innerWidth - 48),
            height: Math.round(Math.min(1024, window.innerWidth - 48) * 9 / 16),
            autoPlay: true,
          },
        });
      })
      .catch(function(err) {
        document.getElementById('player-wrap').innerHTML =
          '<div class="error-state">Failed to load session.<br>' + err.message + '</div>';
      });
  </script>
</body>
</html>
