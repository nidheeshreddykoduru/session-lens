<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Session Lens - Recording</title>
  <script src="https://cdn.jsdelivr.net/npm/rrweb@1.1.3/dist/rrweb.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 60px auto; padding: 0 20px; }
    button { margin: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
    input { margin: 8px; padding: 8px; font-size: 14px; width: 200px; }
    #status { margin-top: 20px; padding: 12px; background: #f0f0f0; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Session Lens Test Page</h1>
  <p>Click around, type, interact — events are recorded and flushed every 5 seconds.</p>

  <div>
    <button onclick="alert('Button 1 clicked!')">Button 1</button>
    <button onclick="document.getElementById('output').textContent = 'Button 2 clicked!'">Button 2</button>
    <button onclick="document.getElementById('output').textContent = ''">Clear</button>
  </div>
  <div>
    <input type="text" placeholder="Type something here..." />
    <input type="email" placeholder="Email address..." />
  </div>
  <p id="output" style="color: green; font-weight: bold;"></p>

  <div id="status">Initializing recorder...</div>

  <script>
    if (typeof rrweb === 'undefined') {
      document.getElementById('status').textContent = 'ERROR: rrweb failed to load from CDN. Check your internet connection.';
      throw new Error('rrweb not loaded');
    }

    const SESSION_ID = 'sess_' + Math.random().toString(36).slice(2, 10);
    let eventBuffer = [];
    let totalSent = 0;

    const status = document.getElementById('status');

    function updateStatus(msg) {
      status.textContent = msg;
      console.log('[session-lens]', msg);
    }

    rrweb.record({
      emit(event) {
        eventBuffer.push(event);
      },
    });

    updateStatus(`Recording started. Session ID: ${SESSION_ID}`);

    async function flush() {
      if (eventBuffer.length === 0) return;

      const batch = eventBuffer.splice(0, eventBuffer.length);

      try {
        const res = await fetch('/record', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: SESSION_ID, events: batch }),
        });
        const data = await res.json();
        totalSent = data.total;
        updateStatus(`Session: ${SESSION_ID} | Flushed ${batch.length} events | Total stored: ${totalSent}`);
      } catch (err) {
        console.error('[session-lens] flush failed:', err);
        eventBuffer.unshift(...batch);
        updateStatus(`Flush failed — events re-queued. Session: ${SESSION_ID}`);
      }
    }

    setInterval(flush, 5000);
    window.addEventListener('beforeunload', flush);
  </script>
</body>
</html>
